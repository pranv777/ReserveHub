name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: reservehub, POSTGRES_PASSWORD: reservehub, POSTGRES_DB: reservehub_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U reservehub" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reservehub:reservehub@localhost:5433/reservehub_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - name: Apply migrations to a clean database
        run: alembic upgrade head
        env: { DATABASE_URL: "postgresql+psycopg://reservehub:reservehub@localhost:5433/reservehub_test" }
      - name: Unit + integration + concurrency tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install   # switch to `npm ci` (+ npm cache) once package-lock.json is committed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Playwright flows that need a real Auth provider run locally (see docs/testing-and-evaluation.md);
  # CI only runs the deterministic smoke test below.
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install   # switch to `npm ci` (+ npm cache) once package-lock.json is committed
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:smoke
